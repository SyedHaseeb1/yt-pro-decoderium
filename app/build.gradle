apply plugin: 'com.android.application'

android {
    namespace "com.google.android.youtube.pro"  
    compileSdk 36

    defaultConfig {
        applicationId "com.google.android.youtube.pro"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 10
        versionName "83.98"

        // To reduce APK size, only include the most common mobile architectures.
        // armeabi-v7a: older 32-bit devices
        // arm64-v8a: modern 64-bit devices
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError false
        disable 'GestureBackNavigation'
    }

    // Build separate APKs for each architecture to significantly reduce file size
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk true // Also build a single APK with both for convenience
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def abi = output.getFilter(com.android.build.OutputFile.ABI)
            if (abi == null) abi = "universal"
            outputFileName = "YTPro_v${variant.versionName}_${abi}_${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    // Add your dependencies here
    implementation 'androidx.webkit:webkit:1.12.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation("com.antonkarpenko:ffmpeg-kit-min:2.2.2")


}



